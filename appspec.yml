version: 0.0
os: linux

files:
  - source: target/
    destination: /home/ec2-user/app/

hooks:
  ApplicationStop:
    - location: scripts/stop_application.sh
      timeout: 60
      runas: ec2-user

  ApplicationStart:
    - location: scripts/start_application.sh
      timeout: 60
      runas: ec2-user
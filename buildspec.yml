version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17

  pre_build:
    commands:
      - echo "Starting Maven build"
      - java -version
      - mvn -version

  build:
    commands:
      - echo "Running Maven package"
      - mvn clean package

  post_build:
    commands:
      - echo "Build completed successfully"
      - ls -la target/

artifacts:
  files:
    - target/*.jar
  discard-paths: yes
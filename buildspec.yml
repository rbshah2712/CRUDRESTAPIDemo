version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17

  pre_build:
    commands:
      - echo "Starting Maven build..."

  build:
    commands:
      - echo "Build started"
      - mvn clean package -DskipTests

  post_build:
    commands:
      - echo "Build completed"

artifacts:
  files:
    - target/*.jar
    - appspec.yml
    - scripts/**/*
  discard-paths: no